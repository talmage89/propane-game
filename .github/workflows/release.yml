# Every push to main builds Windows (x86_64), macOS (Apple Silicon) and Linux (x86_64), then publishes a new release
# for the version in project.godot. tools/release/cut.sh makes those pushes. The job stops first if the version may not be
# released (tools/release/check_version.sh): already released, not newer, or a patch that changes the protocol.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  # Not RCODESIGN_*: rcodesign reads every variable with that prefix as its own configuration.
  APPLE_CODESIGN_VERSION: 0.29.0

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release tags, for the version check and the notes

      - name: Check the version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot)"
          if ! tools/release/check_version.sh "$version" 2>check.log; then
            echo "::error::$(cat check.log)"
            exit 1
          fi
          echo "VERSION=$version" >>"$GITHUB_ENV"

      - name: Cache Godot, templates and rcodesign
        uses: actions/cache@v4
        with:
          path: ~/.cache/propane-ci
          key: pinned-tools-godot-${{ env.GODOT_VERSION }}-rcodesign-${{ env.APPLE_CODESIGN_VERSION }}

      - uses: ./.github/actions/setup-godot
        with:
          godot-version: ${{ env.GODOT_VERSION }}
          cache: 'false' # the release tool bundle above already caches the editor

      - name: Install export templates and rcodesign
        run: |
          set -euo pipefail
          cache="$HOME/.cache/propane-ci"
          mkdir -p "$cache"
          tools/release/install_signer.sh "$APPLE_CODESIGN_VERSION" "$cache"

          if ! command -v llvm-lipo >/dev/null && ! ls /usr/bin/llvm-lipo-* >/dev/null 2>&1; then
            sudo apt-get update -q && sudo apt-get install -yq llvm
          fi
          TEMPLATE_CACHE="$cache" tools/release/install_templates.sh "$GODOT_VERSION"

      - name: Headless tests
        run: |
          set -euo pipefail
          make setup
          make test

      - name: Build
        run: tools/release/build.sh "$GODOT"

      - name: Verify the packaged exports and smoke the Linux artifact
        run: python3 -B tools/release/check_artifacts.py --output build/release-artifact-proof

      - name: Preserve artifact proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact-proof
          path: build/release-artifact-proof/*.log

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          previous="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"
          {
            echo "Built from ${GITHUB_SHA::7}. Plays with every ${VERSION%.*}.x."
            echo
            if [[ -n "$previous" ]]; then
              echo "Changes since $previous:"
              git log --format='- %s' --invert-grep --grep='^Release v' "$previous..$GITHUB_SHA"
              echo
            fi
            echo "**Windows (x86_64):** extract the ZIP and run Propane.exe. It is unsigned: if SmartScreen blocks it,"
            echo "click More info, then Run anyway. Needs a GPU with Vulkan drivers."
            echo
            echo "**macOS (Apple Silicon):** unzip, then open Propane.app. The first time, macOS blocks it because it is"
            echo "not notarized: open System Settings > Privacy & Security and click Open Anyway."
            echo
            echo "**Linux (x86_64):** extract the archive and run \`./Propane.x86_64\`. Needs Vulkan drivers."
          } > build/notes.md
          gh release create "$tag" build/dist/* --target "$GITHUB_SHA" --title "Propane $VERSION" \
            --notes-file build/notes.md --latest
