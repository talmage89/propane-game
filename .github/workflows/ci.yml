name: CI

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: make lint

  # The gate's own self-tests (analyzer negatives, make ordering and failure propagation, deep-shard and CI wiring).
  # They stub Godot, so this job needs neither the editor nor the imported assets.
  infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: make test-infra

  imports:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          godot-version: ${{ env.GODOT_VERSION }}
      - uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-import-linux-${{ env.GODOT_VERSION }}-${{ hashFiles('assets/**', 'icon.svg', 'icon.svg.import', 'project.godot') }}
      - name: Import assets
        run: '"$GODOT" --headless --path . --import'

  tests:
    needs: imports
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [core, behavior, generator, world]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          godot-version: ${{ env.GODOT_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: .godot/imported
          key: godot-import-linux-${{ env.GODOT_VERSION }}-${{ hashFiles('assets/**', 'icon.svg', 'icon.svg.import', 'project.godot') }}
      # Rebuild the per-checkout resource index even after restoring imported assets.
      - name: Import resource index
        run: '"$GODOT" --headless --path . --import'
      - name: Test partition
        run: make test-${{ matrix.suite }}

  # Preserve one stable required check for branch protection; every partition must succeed.
  check:
    if: always()
    needs: [lint, infra, imports, tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all checks
        env:
          LINT: ${{ needs.lint.result }}
          INFRA: ${{ needs.infra.result }}
          IMPORTS: ${{ needs.imports.result }}
          TESTS: ${{ needs.tests.result }}
        run: test "$LINT" = success && test "$INFRA" = success && test "$IMPORTS" = success && test "$TESTS" = success
